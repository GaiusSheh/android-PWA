# 版本目录（version catalog）：集中管理插件和依赖版本。
# 升级时只改这里。版本号均为 2026-10 时的最新稳定版。
[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
appcompat = "1.8.0"
activity = "1.13.0"
webkit = "1.18.0"
swiperefreshlayout = "1.2.0"
splashscreen = "1.2.0"
gson = "2.15.0"
# 以下仅工厂 App（factory 模块）使用
material = "1.14.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
apksig = "9.4.1"
jsoup = "1.23.2"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
# 仅 buildSrc（构建逻辑）使用：解析 apps.json
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# 工厂 App：界面组件、协程、APK 签名（Google 官方 apksig，与 apksigner 同一套实现）、HTML 解析
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
