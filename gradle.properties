# Gradle 守护进程的 JVM 参数（R8 压缩需要较多内存）
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 关闭 release 包的资源路径缩短（默认会把 res/mipmap-xxhdpi-v4/ic_launcher_foreground.png 改名成 res/-B.png）。
# 工厂 App 靠固定路径在手机上替换模板 APK 里的图标，所以必须关闭。代价只是 APK 多几 KB。
android.enableResourceOptimizations=false

# Kotlin 2.x 会在工程根目录写 .kotlin/ 会话文件；与 .gradle/ 一样已在 .gitignore 中忽略
kotlin.code.style=official
